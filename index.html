  function furthestAllowedIndex(){
    var pages = currentPages();
    for(var i=0;i<pages.length-1;i++){ if(!sectionComplete(pages[i])) return i; }
    return pages.length-1;
  }
  function isBlockedByLateGate(){ return appState.view==='entry' && state.late && !state.lateAcknowledged; }

  function renderStepperNav(){
    var s = document.getElementById('stepper');
    if(appState.view!=='entry' || isBlockedByLateGate() || isBlockedByDuplicateGate()){ s.style.display='none'; return; }
    s.style.display='flex'; s.innerHTML='';
    var maxAllowed = furthestAllowedIndex();
    var pages = currentPages();
    var titles = currentPageTitles();
    pages.forEach(function(p, i){
      var complete = p!=='review' && sectionComplete(p);
      var hasFlag = false;
      var sec = currentSections().filter(function(s2){return s2.id===p;})[0];
      if(sec) hasFlag = biomedFlags().some(function(f){ return f.section===sec.title; });
      var locked = i>maxAllowed;
      var cls = 'step-pill'+(i===current?' active':'')+(complete?' done':'')+(hasFlag?' flag':'')+(locked?' locked':'');
      var pill = el('div',{class:cls},[el('span',{class:'dot'}), text(titles[p])]);
      if(locked){ pill.title = 'Complete the sections before this one first.'; }
      else { pill.addEventListener('click', function(){ current=i; renderApp(); }); }
      s.appendChild(pill);
    });
    var active = s.querySelector('.active'); if(active) active.scrollIntoView({inline:'center', block:'nearest'});
  }

  function renderBottombar(){
    var bb = document.getElementById('bottombar');
    if(appState.view!=='entry' || isBlockedByLateGate() || isBlockedByDuplicateGate()){ bb.style.display='none'; return; }
    bb.style.display='block';
    var pages = currentPages();
    var complete = sectionComplete(pages[current]);
    var prevBtn = document.getElementById('btnPrev');
    var nextBtn = document.getElementById('btnNext');
    prevBtn.disabled = (current===0);
    if(current===pages.length-1 || !pageNeedsManualNext(pages[current])){ nextBtn.style.visibility='hidden'; }
    else { nextBtn.style.visibility='visible'; nextBtn.disabled = !complete; }
    document.getElementById('posLabel').innerHTML = 'Section '+(current+1)+' of '+pages.length + (complete? '' : '<span class="hint-incomplete">Complete this section to continue</span>');
  }

  function renderLateGate(container){
    var wrap = el('div',{class:'login-wrap'});
    var box = el('div',{class:'card', style:'border:2px solid var(--danger);background:var(--danger-soft);text-align:center;'});
    box.appendChild(el('div',{style:'font-size:32px;margin-bottom:6px;'},[text('⚠')]));
    box.appendChild(el('h2',{style:'color:var(--danger);font-size:18px;margin-bottom:10px;'},[text('Late / Missed Input')]));
    var msg = state.lateReason==='retrospective'
      ? 'You\'re filling in a missed checklist for '+state.date+'. This is a retrospective entry.'
      : 'The OR Opener Readiness Checklist is required between 5:00 AM and 12:00 NN. You are logging this outside that window.';
    box.appendChild(el('p',{style:'font-size:14px;color:var(--ink);margin-bottom:14px;'},[text(msg)]));
    box.appendChild(el('p',{style:'font-size:13px;font-weight:700;color:var(--danger);margin-bottom:18px;'},[text('This late entry is recorded and will be included in staff performance evaluation as "Missed Input."')]));
    var btn = el('button',{class:'submit-btn', style:'background:var(--danger);'},[text('I Understand, Continue')]);
    btn.addEventListener('click', function(){ state.lateAcknowledged=true; renderApp(); });
    box.appendChild(btn);
    wrap.appendChild(box);
    container.appendChild(wrap);
  }
  function isBlockedByDuplicateGate(){ return appState.view==='entry' && !!state.duplicateExisting && !state.duplicateAcknowledged; }
  function renderDuplicateGate(container){
    var wrap = el('div',{class:'login-wrap'});
    var box = el('div',{class:'card', style:'border:2px solid var(--amber);background:var(--amber-soft);text-align:center;'});
    box.appendChild(el('div',{style:'font-size:32px;margin-bottom:6px;'},[text('⚠')]));
    box.appendChild(el('h2',{style:'color:var(--amber);font-size:18px;margin-bottom:10px;'},[text('Already Logged Today')]));
    var existing = state.duplicateExisting;
    var whenStr = existing ? new Date(existing.submittedAt).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}) : '';
    box.appendChild(el('p',{style:'font-size:14px;color:var(--ink);margin-bottom:6px;'},[
      text(existing ? (existing.recorder+' already submitted the '+state.room+' checklist for '+state.date+' at '+whenStr+'.') : '')
    ]));
    box.appendChild(el('p',{style:'font-size:13px;color:var(--ink-soft);margin-bottom:18px;'},[text('If this wasn\'t coordinated between you, check with them before submitting a second entry for the same room and day.')]));
    var btnRow = el('div',{class:'btn-row'});
    var backBtn = el('button',{class:'nav-btn prev'},[text('← Go Back')]);
    backBtn.addEventListener('click', function(){ if(retroModal.active){ closeRetroModal(); } else { logout(); } });
    var contBtn = el('button',{class:'nav-btn next'},[text('Continue Anyway')]);
    contBtn.addEventListener('click', function(){ state.duplicateAcknowledged=true; renderApp(); });
    btnRow.appendChild(backBtn); btnRow.appendChild(contBtn);
    box.appendChild(btnRow);
    wrap.appendChild(box);
    container.appendChild(wrap);
  }

  function appendFooter(container){
    var footer = el('div',{style:'text-align:center;padding:26px 20px 16px 20px;font-size:11.5px;color:var(--ink-faint);'});
    footer.appendChild(text('Developed by '));
    var link = el('a',{href:'https://ralpparagili.org', target:'_blank', rel:'noopener noreferrer', style:'color:var(--teal);text-decoration:none;font-weight:600;'},[text('Ralp Paragili')]);
    footer.appendChild(link);
    container.appendChild(footer);
  }

  function renderSuperuserRoomPicker(container){
    var wrap = el('div',{class:'login-wrap'});
    wrap.appendChild(el('div',{class:'section-head'},[el('h2',{},[text('Which room are you logging?')])]));
    wrap.appendChild(el('div',{class:'section-sub'},[text('Superuser accounts aren\'t tied to a fixed room — pick one to start a checklist.')]));
    var chipWrap = el('div',{class:'chip-group', style:'justify-content:center;'});
    ROOM_OPTIONS.forEach(function(r){
      var chip = el('button',{class:'chip'},[text(r)]);
      chip.addEventListener('click', function(){ startAdHocEntry(r); });

  function renderContent(){
    var content = document.getElementById('content');
    content.innerHTML='';
    if(appState.view==='login'){ renderLogin(content); appendFooter(content); return; }
    if(appState.view==='public-dashboard'){ renderPublicDashboard(content); appendFooter(content); return; }
    if(appState.view==='dashboard'){ renderDashboard(content); appendFooter(content); return; }
    if(appState.view==='admin'){ renderAdmin(content); appendFooter(content); return; }
    if(appState.view==='exceptions'){ renderExceptionsTab(content); appendFooter(content); return; }
    if(appState.view==='archives'){ renderArchivesTab(content); appendFooter(content); return; }
    if(appState.view==='verify'){ renderVerifyTab(content); appendFooter(content); return; }
    if(appState.view==='upload'){ renderUploadTab(content); appendFooter(content); return; }
    if(appState.view==='errors'){ renderErrorsTab(content); appendFooter(content); return; }
    // entry view — each step is a single container, so it stays a comfortable centered
    // width even on a wide screen, rather than stretching edge to edge.
    if(session.user && session.user.role==='superuser' && !state.room){
      renderSuperuserRoomPicker(content); appendFooter(content); return;
    }
    if(isBlockedByDuplicateGate()){ renderDuplicateGate(content); appendFooter(content); return; }
    if(isBlockedByLateGate()){ renderLateGate(content); appendFooter(content); return; }
    var entryWrap = el('div',{class:'entry-narrow'});
    content.appendChild(entryWrap);
    var pageId = currentPages()[current];
    if(pageId==='header') renderHeaderPage(entryWrap);
    else if(pageId==='climate') renderClimatePage(entryWrap);
    else if(pageId==='gases') renderGasesPage(entryWrap);
    else if(pageId==='formsprep') renderFormsPrepPage(entryWrap);
    else if(pageId==='review') renderReviewPage(entryWrap);
    else { var sec = currentSections().filter(function(s){return s.id===pageId;})[0]; renderCheckPage(entryWrap, sec); }
    appendFooter(entryWrap);
  }

  var autoAdvanceTimer = null;
  var autoAdvanceForIndex = -1;
  function pageNeedsManualNext(pageId){
    // Header (recorder/date/room + compliance card) always needs a manual look before
    // moving on. Climate needs one too, but only when the reading is abnormal — that's
    // the moment there's an Immediate Action list to actually read and select from.
    if(pageId==='header') return true;
    if(pageId==='climate' && state.abnormal==='Yes') return true;
    return false;
  }
  function maybeAutoAdvance(){
    var inEntry = appState.view==='entry' && !retroModal.active;
    var inModalChecklist = retroModal.active && retroModal.mode==='checklist';
    if(!inEntry && !inModalChecklist) return;
    var pages = currentPages();
    var pageId = pages[current];
    // Review (holds the Submit action) always stays manual; header/climate-abnormal
    // are handled by pageNeedsManualNext. Everything else can auto-advance.
    if(pageId==='review' || pageNeedsManualNext(pageId)){
      // Cancel any timer scheduled before conditions changed (e.g. abnormal flipped
      // to "Yes" after the section briefly looked auto-advance-eligible).
      if(autoAdvanceTimer){ clearTimeout(autoAdvanceTimer); autoAdvanceTimer=null; }
      return;
    }
    if(isBlockedByLateGate() || isBlockedByDuplicateGate()) return;
    if(current>=pages.length-1) return;
    if(!sectionComplete(pageId)) return;
    if(autoAdvanceTimer && autoAdvanceForIndex===current) return;
    if(autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
    autoAdvanceForIndex = current;
    autoAdvanceTimer = setTimeout(function(){
      autoAdvanceTimer = null;
      var pages2 = currentPages();
      if(current===autoAdvanceForIndex && current<pages2.length-1 && sectionComplete(pages2[current])){
        current++;
        renderApp();
        window.scrollTo({top:0,behavior:'smooth'});
      }
    }, 550);
  }
  function renderApp(){
    saveLocalCache();
    updateOfflineBanner();
    if(appState.view==='entry') scheduleDraftSave();
    renderLaunchOverlay();
    renderLoginModal();
    renderNotifModal();
    if(retroModal.active){ renderRetroModalContent(); return; }
    renderTopbar();
    renderInfoChips();
    renderTabs();
    renderStepperNav();
    renderContent();
    renderBottombar();
    maybeAutoAdvance();
  }

  document.getElementById('btnNext').addEventListener('click', function(){ if(autoAdvanceTimer){ clearTimeout(autoAdvanceTimer); autoAdvanceTimer=null; } var pages=currentPages(); if(current<pages.length-1 && sectionComplete(pages[current])){ current++; renderApp(); window.scrollTo({top:0,behavior:'smooth'}); } });
  document.getElementById('retroModalPrev').addEventListener('click', function(){ if(current>0){ current--; renderApp(); } });

  loadFromSupabase().then(function(hadData){
    if(hadData===null){
      // Couldn't reach Supabase — fall back to the last-known local cache (if any)
      // instead of wrongly re-seeding from the baseline, so the app still works offline.
      var gotCache = loadLocalCache();
      if(!gotCache){
        // No connection AND nothing cached yet (very first load, offline) — seed from
        // the baseline so there's at least something to work with; it'll reconcile
        // with Supabase once a connection is available.
        processScheduleCSVText(BASELINE_SCHEDULE_CSV);
      }
    } else if(!hadData){
      processScheduleCSVText(BASELINE_SCHEDULE_CSV);
      users.forEach(syncUserUpsert);
    }
    purgeExpiredData();
    refreshAutoAnalysis();

    document.getElementById('updateRefreshBtn').addEventListener('click', function(){
      window.location.href = location.pathname + '?v=' + Date.now();
    });
    document.getElementById('updateDismissBtn').addEventListener('click', function(){
      updateState.dismissedVersion = updateState.latestVersion;
      document.getElementById('updateBanner').style.display = 'none';
      updateBodyBannerOffset();
    });
    setInterval(checkForUpdate, 5*60*1000);
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') checkForUpdate(); });

    window.addEventListener('online', function(){ flushPendingQueue(); updateOfflineBanner(); });
    window.addEventListener('offline', updateOfflineBanner);
    setInterval(flushPendingQueue, 30*1000);
    flushPendingQueue();
    updateOfflineBanner();

    // Cache the app shell itself so the page can be opened cold with zero
    // connection, not just kept running once already open. sw.js must sit in the
    // same folder as this file on the server for the scope to line up.
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(function(err){ console.error('Service worker registration failed', err); });
    }

    renderApp();
  });
})();
</script>
</body>
</html>
