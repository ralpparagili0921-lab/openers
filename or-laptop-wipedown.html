<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laptop / iPad Wipedown — Prototype</title>
<style>
  :root {
    --fern: #7F9F49;
    --fern-strong: #5C7A32;
    --honey: #F4CA14;
    --danger: #C4432E;
    --ink: #2A2A26;
    --slate: #6E6D69;
    color-scheme: light;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F2F1ED;
    color: var(--ink);
    overscroll-behavior: none;
  }
  .screen {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .opener-topnav {
    flex: 0 0 auto;
    display: flex; gap: 8px;
    padding: 8px 10px 4px;
    background: #1a1a18;
  }
  .opener-topnav a {
    flex: 1; text-align: center; text-decoration: none;
    font-size: 11px; font-weight: 800; color: #fff;
    background: rgba(255,255,255,0.12);
    padding: 7px 10px; border-radius: 999px;
  }
  .opener-topnav a.logout-link { background: rgba(196,67,46,0.35); }

  .banner {
    flex: 0 0 auto;
    background: linear-gradient(135deg, #E7EFDC, #DCE8D0);
    padding: 8px 16px 7px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .banner h1 {
    font-size: 13px; font-weight: 700; margin: 0;
    background: var(--fern); color: #fff;
    display: inline-block; padding: 5px 13px; border-radius: 999px;
  }

  .item-list {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    padding: 5px 6px;
    gap: 5px;
    min-height: 0;
  }
  .item-card {
    display: flex;
    background: #fff;
    border-radius: 12px;
    padding: 5px;
    min-height: 0;
    border: 1.5px solid #eae8e0;
    transition: border-color 0.2s, background 0.2s;
    overflow: hidden;
    gap: 5px;
  }
  .item-card.is-flag { border-color: var(--danger); background: #FBEAE8; }
  .item-card.is-done { border-color: var(--fern-strong); background: #DCE8D0; }

  .item-image {
    flex: 1 1 36%; min-width: 0;
    border-radius: 9px;
    background: #EDEBE4;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .item-image svg { width: 68%; height: 68%; }
  .image-pending-tag {
    position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    font-size: 8px; font-weight: 800; color: var(--slate); opacity: 0.6;
    white-space: nowrap;
  }

  .right-col {
    flex: 1 1 64%; min-width: 0;
    display: flex; flex-direction: column;
    gap: 4px;
  }

  @media (max-width: 820px) {
    .item-list {
      grid-template-columns: 1fr;
      grid-template-rows: none;
      overflow-y: auto;
    }
    .item-card { min-height: auto; overflow: visible; }
    .item-image { min-height: 150px; }
  }

  .item-name { font-size: 20px; font-weight: 900; line-height: 1.0; letter-spacing: -0.01em; margin-bottom: 2px; }

  .sub-toggle {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.65); border-radius: 10px; padding: 7px 11px;
    font-size: 15px; font-weight: 800; color: var(--ink);
    flex-shrink: 0;
  }
  .item-card.is-done .sub-toggle, .item-card.is-flag .sub-toggle { background: rgba(255,255,255,0.8); }
  .sub-toggle .label-col { display: flex; flex-direction: column; gap: 1px; }
  .sub-toggle .sub-caption { font-size: 9.5px; font-weight: 600; opacity: 0.65; line-height: 1.2; }
  .mini-switch {
    width: 50px; height: 30px; border-radius: 999px; border: none; cursor: pointer;
    background: #d8d6cf; position: relative; padding: 0; flex-shrink: 0;
  }
  .mini-switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    transition: left 0.3s ease;
  }
  .mini-switch.on { background: var(--fern-strong); }
  .mini-switch.on::after { left: calc(100% - 27px); }
  .sub-toggle.is-locked { background: #F3D7D3; }
  .mini-switch.locked { background: var(--danger); opacity: 0.55; cursor: not-allowed; }

  .pf-buttons { display: flex; gap: 5px; flex-shrink: 0; }
  .pf-btn {
    border: 1.5px solid #d8d6cf; background: #fff; border-radius: 999px;
    padding: 5px 10px; font-size: 11px; font-weight: 800; color: var(--ink);
    cursor: pointer;
  }
  .pf-btn.selected.pass { background: var(--fern-strong); border-color: var(--fern-strong); color: #fff; }
  .pf-btn.selected.fail { background: var(--danger); border-color: var(--danger); color: #fff; }
  .sub-toggle.is-pending .pf-btn { animation: rowGlow 1.6s ease-in-out infinite; }
  @keyframes rowGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(127,159,73,0.4); }
    50% { box-shadow: 0 0 0 4px rgba(127,159,73,0); }
  }

  .remarks-section { flex: 0 0 auto; }
  .remarks-line {
    width: 100%; border-radius: 7px; border: 1px solid #e5e2d8;
    padding: 7px 8px; font-size: 10px; font-family: inherit;
    min-height: 36px; resize: none;
    background: #FAF9F6; color: var(--ink); color-scheme: light;
  }
  .remarks-line::placeholder { color: #ada99e; font-size: 9.5px; }
  .item-card.is-flag .remarks-line { background: #fff; border-color: var(--danger); }

  .bottom-sheet {
    flex: 0 0 auto;
    padding: 8px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    background: #fff;
    border-top: 1px solid rgba(0,0,0,0.06);
  }
  .progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .progress-track { flex: 1; height: 6px; background: #EDEBE4; border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--fern); width: 0%; transition: width 0.25s; }
  .progress-text { font-size: 11px; font-weight: 700; color: var(--ink); white-space: nowrap; }

  .continue-btn {
    display: none; width: 100%; align-items: center; justify-content: center; gap: 5px;
    background: var(--fern); color: #fff;
    padding: 10px; border-radius: 999px;
    font-size: 13.5px; font-weight: 700; border: none; cursor: pointer;
    animation: continuePulse 1.6s ease-in-out infinite;
  }
  @keyframes continuePulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(127,159,73,0.5); }
    50% { box-shadow: 0 0 0 6px rgba(127,159,73,0); }
  }

  .popup-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  .popup-overlay.show { display: flex; }
  .popup-box { background: #fff; border-radius: 16px; padding: 20px 18px; max-width: 320px; width: 100%; text-align: left; }
  .popup-box .icon { font-size: 26px; margin-bottom: 4px; text-align: center; }
  .popup-box h2 { font-size: 14.5px; margin: 0 0 4px; text-align: center; }
  .popup-box p { font-size: 12.5px; text-align: center; margin: 0 0 10px; }
  .err-preview { font-size: 12px; color: var(--danger); background: #FBEAE8; border-radius: 8px; padding: 6px 10px; margin-bottom: 10px; }
  .popup-box label { font-size: 12px; font-weight: 700; display: block; margin-bottom: 4px; }
  .popup-box textarea {
    width: 100%; border-radius: 10px; border: 1px solid #ddd9cf;
    padding: 8px 10px; font-size: 13px; font-family: inherit;
    resize: none; background: #fbfaf7; color: var(--ink); color-scheme: light;
    margin-bottom: 14px;
  }
  .popup-box button {
    width: 100%; background: var(--danger); color: #fff; border: none;
    padding: 11px 10px; border-radius: 999px; font-weight: 700; font-size: 13.5px; cursor: pointer;
  }
  .popup-stamp { margin: 8px 0 0; font-size: 11px; font-weight: 700; opacity: 0.6; color: var(--ink); text-align: center; }

  .advance-overlay .popup-box { text-align: center; }
  .advance-link {
    display: block; width: 100%;
    background: var(--fern); color: #fff; border: none; text-decoration: none;
    padding: 12px 10px; border-radius: 999px; font-weight: 700; font-size: 14.5px;
    box-sizing: border-box; margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="opener-topnav">
      <a href="index.html?view=dashboard">&larr; Back to Dashboard</a>
      <a class="logout-link" href="index.html">Logout</a>
    </div>
    <div class="banner"><h1>Laptop / iPad Wipedown</h1></div>

    <div class="item-list" id="itemList"></div>

    <div class="bottom-sheet">
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-text" id="progressText">0 / 4</span>
      </div>
      <button class="continue-btn" id="continueBtn">Continue →</button>
    </div>
  </div>

  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <div class="icon">⚠️</div>
      <h2 id="popupTitle">Problem reported</h2>
      <div class="err-preview" id="popupErrPreview"></div>
      <label for="actionsInput">Actions taken</label>
      <textarea id="actionsInput" rows="3" placeholder="What was done in response?"></textarea>
      <button id="popupSubmit">Submit</button>
    </div>
  </div>

  <div class="popup-overlay" id="batteryPopupOverlay">
    <div class="popup-box">
      <div class="icon">🔋</div>
      <h2 id="batteryPopupTitle">Battery needs replacement</h2>
      <label for="batteryActionsInput">Actions taken</label>
      <textarea id="batteryActionsInput" rows="3" placeholder="e.g. swapped with spare unit from storage"></textarea>
      <button id="batteryPopupSubmit">Submit — this will be recorded</button>
    </div>
  </div>

  <div class="popup-overlay" id="allDoneOverlay">
    <div class="popup-box" id="allDoneBox">
      <div class="icon">✅</div>
      <h2>Opener Checklist Complete</h2>
      <p>All 9 sections of this morning's opening routine are done. Submitting will record this checklist.</p>
      <button id="finalSubmitBtn">Submit →</button>
    </div>
  </div>

<script>
  // --- Supabase: shared insert helper + global error capture ---
  var SUPABASE_URL = 'https://jgnweipcjghgdnktpsww.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_qIvxyRTzz7Zc6F7wDD8E_g_aj5JAu66';
  function supabaseInsert(table, row) {
    return fetch(SUPABASE_URL + '/rest/v1/' + table, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(row)
    });
  }
  function reportError(message, stack, extra) {
    supabaseInsert('error_reports', {
      message: String(message || '').slice(0, 2000),
      stack: String(stack || '').slice(0, 4000),
      context: (extra || '') + ' @ ' + location.pathname,
      reported_by: (typeof currentStaff !== 'undefined' && currentStaff) ? currentStaff.name : null,
      view: location.pathname,
      occurred_at: new Date().toISOString()
    }).catch(function(){}); // never let error reporting itself throw
  }
  window.addEventListener('error', function(e){
    reportError(e.message, e.error ? e.error.stack : '', 'window.onerror');
  });
  window.addEventListener('unhandledrejection', function(e){
    var reason = e.reason;
    reportError(
      'Unhandled promise rejection: ' + (reason && reason.message ? reason.message : reason),
      reason && reason.stack ? reason.stack : '',
      'unhandledrejection'
    );
  });

  // Simple line-art SVGs standing in for real device photos — clearly
  // marked as placeholders, not final art. Intended to be swapped for
  // real photos the user uploads, processed the same way as every other
  // section's equipment images.
  var LAPTOP_SVG = '<svg viewBox="0 0 100 70" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<rect x="20" y="6" width="60" height="42" rx="3" stroke="#9a978c" stroke-width="3"/>' +
    '<rect x="26" y="12" width="48" height="30" rx="1" fill="#d8d6cf"/>' +
    '<path d="M8 58 L92 58 L84 50 L16 50 Z" stroke="#9a978c" stroke-width="3" stroke-linejoin="round" fill="#eceae2"/>' +
    '</svg>';
  var IPAD_SVG = '<svg viewBox="0 0 70 100" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<rect x="8" y="6" width="54" height="88" rx="7" stroke="#9a978c" stroke-width="3"/>' +
    '<rect x="14" y="14" width="42" height="68" rx="1" fill="#d8d6cf"/>' +
    '<circle cx="35" cy="90" r="2.4" fill="#9a978c"/>' +
    '</svg>';

  var REMARKS_PLACEHOLDER = 'What\'s wrong? (e.g. screen cracked)';

  var items = [
    { id: 'laptop1', label: 'Laptop 1', deviceType: 'laptop', cleanCaption: 'Using disinfectant wipes — keyboard & trackpad especially' },
    { id: 'laptop2', label: 'Laptop 2', deviceType: 'laptop', cleanCaption: 'Using disinfectant wipes — keyboard & trackpad especially' },
    { id: 'ipad1', label: 'iPad 1', deviceType: 'ipad', cleanCaption: 'Using disinfectant wipes — especially the screen' },
    { id: 'ipad2', label: 'iPad 2', deviceType: 'ipad', cleanCaption: 'Using disinfectant wipes — especially the screen' }
  ];
  var state = {};
  items.forEach(function(it){
    state[it.id] = { cleaned: false, battery: null, remarks: '', actionsTaken: '', popupShown: false, batteryActionsTaken: '' };
  });

  // --- draft autosave: local-only, 4-hour expiry ---
  var DRAFT_KEY = 'opener_draft_laptop-ipad-wipedown';
  var DRAFT_MAX_AGE_MS = 4 * 60 * 60 * 1000;
  function saveDraft() { localStorage.setItem(DRAFT_KEY, JSON.stringify({ savedAt: Date.now(), state: state })); }
  function tryRestoreDraft() {
    var raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return;
    try {
      var draft = JSON.parse(raw);
      if (Date.now() - draft.savedAt > DRAFT_MAX_AGE_MS) { localStorage.removeItem(DRAFT_KEY); return; }
      Object.keys(draft.state).forEach(function(id){ if (state[id]) Object.assign(state[id], draft.state[id]); });
    } catch (e) { localStorage.removeItem(DRAFT_KEY); }
  }
  tryRestoreDraft();

  var listEl = document.getElementById('itemList');
  var pendingBatteryItem = null;

  function statusFor(it) {
    var st = state[it.id];
    if (st.remarks.trim().length > 0) return 'flag';
    if (st.cleaned && st.battery) return 'done';
    return 'pending';
  }

  function render() {
    listEl.innerHTML = '';
    items.forEach(function(it){
      var st = state[it.id];
      var status = statusFor(it);
      var card = document.createElement('div');
      card.className = 'item-card is-' + status;

      var img = document.createElement('div');
      img.className = 'item-image';
      img.innerHTML = (it.deviceType === 'laptop' ? LAPTOP_SVG : IPAD_SVG) + '<span class="image-pending-tag">📷 Photo pending</span>';
      card.appendChild(img);

      var rightCol = document.createElement('div');
      rightCol.className = 'right-col';

      var name = document.createElement('div');
      name.className = 'item-name';
      name.textContent = it.label;
      rightCol.appendChild(name);

      // Cleaned toggle
      var cleanRow = document.createElement('div');
      cleanRow.className = 'sub-toggle' + (status === 'flag' ? ' is-locked' : '');
      cleanRow.innerHTML = '<span class="label-col"><span>Cleaned</span><span class="sub-caption">' + it.cleanCaption + '</span></span>';
      var cleanSw = document.createElement('button');
      cleanSw.className = 'mini-switch' + (st.cleaned ? ' on' : '') + (status === 'flag' ? ' locked' : '');
      cleanSw.setAttribute('aria-label', 'Toggle cleaned: ' + it.label);
      if (status === 'flag') { cleanSw.disabled = true; }
      else { cleanSw.onclick = function(e){ e.stopPropagation(); st.cleaned = !st.cleaned; render(); }; }
      cleanRow.appendChild(cleanSw);
      rightCol.appendChild(cleanRow);

      // Battery Pass/Replace
      var battRow = document.createElement('div');
      battRow.className = 'sub-toggle' + (status === 'flag' ? ' is-locked' : (!st.battery ? ' is-pending' : ''));
      battRow.innerHTML = '<span>Battery</span>';
      var battCol = document.createElement('div');
      battCol.className = 'pf-buttons';
      var passBtn = document.createElement('button');
      passBtn.className = 'pf-btn pass' + (st.battery === 'pass' ? ' selected' : '');
      passBtn.textContent = 'Pass';
      var replaceBtn = document.createElement('button');
      replaceBtn.className = 'pf-btn fail' + (st.battery === 'replace' ? ' selected' : '');
      replaceBtn.textContent = 'Replace';
      if (status === 'flag') { passBtn.disabled = true; replaceBtn.disabled = true; }
      else {
        passBtn.onclick = function(){ st.battery = 'pass'; render(); };
        replaceBtn.onclick = function(){
          st.battery = 'replace';
          pendingBatteryItem = it;
          document.getElementById('batteryPopupTitle').textContent = it.label + ' — battery replaced';
          document.getElementById('batteryActionsInput').value = st.batteryActionsTaken || '';
          document.getElementById('batteryPopupOverlay').classList.add('show');
          render();
        };
      }
      battCol.appendChild(passBtn); battCol.appendChild(replaceBtn);
      battRow.appendChild(battCol);
      rightCol.appendChild(battRow);

      var remarksSection = document.createElement('div');
      remarksSection.className = 'remarks-section';
      var remarks = document.createElement('textarea');
      remarks.rows = 2;
      remarks.className = 'remarks-line';
      remarks.placeholder = REMARKS_PLACEHOLDER;
      remarks.value = st.remarks;
      remarks.addEventListener('input', function(e){ st.remarks = e.target.value; });
      remarks.addEventListener('blur', function(){
        if (st.remarks.trim().length > 0 && !st.popupShown) {
          st.popupShown = true;
          openActionsPopup(it, st);
        } else if (st.remarks.trim().length === 0) {
          st.popupShown = false;
        }
        render();
      });
      remarksSection.appendChild(remarks);
      rightCol.appendChild(remarksSection);

      card.appendChild(rightCol);
      listEl.appendChild(card);
    });
    updateProgress();
  }

  function isFullyResolved(it) {
    var st = state[it.id];
    if (st.remarks.trim().length > 0) return true;
    return st.cleaned && !!st.battery;
  }
  function updateProgress() {
    var resolved = items.filter(isFullyResolved).length;
    document.getElementById('progressFill').style.width = (resolved / items.length * 100) + '%';
    document.getElementById('progressText').textContent = resolved + ' / ' + items.length;
    document.getElementById('continueBtn').style.display = resolved === items.length ? 'flex' : 'none';
    saveDraft();
  }

  var popupEl = document.getElementById('popupOverlay');
  var currentPopupItem = null;
  function openActionsPopup(it, st) {
    currentPopupItem = it;
    document.getElementById('popupTitle').textContent = it.label + ' — problem reported';
    document.getElementById('popupErrPreview').textContent = st.remarks;
    document.getElementById('actionsInput').value = st.actionsTaken || '';
    popupEl.classList.add('show');
  }
  document.getElementById('popupSubmit').addEventListener('click', function(){
    if (currentPopupItem) {
      state[currentPopupItem.id].actionsTaken = document.getElementById('actionsInput').value;
    }
    popupEl.classList.remove('show');
    currentPopupItem = null;
  });

  document.getElementById('batteryPopupSubmit').addEventListener('click', function(){
    if (pendingBatteryItem) {
      state[pendingBatteryItem.id].batteryActionsTaken = document.getElementById('batteryActionsInput').value;
    }
    document.getElementById('batteryPopupOverlay').classList.remove('show');
    pendingBatteryItem = null;
    saveDraft();
  });

  // this is the last section in the Opener checklist — Continue leads to
  // the real final step (Submit), not another section's advance popup
  document.getElementById('continueBtn').addEventListener('click', function(){
    document.getElementById('allDoneOverlay').classList.add('show');
  });

  // All 9 OR sections' drafts, gathered into one payload and inserted as
  // ONE submitted_logs row -- matches how the app actually works: one
  // Submit button, on this final section, not one per section.
  var OR_DRAFT_KEYS = [
    'opener_draft_damp-dusting', 'opener_draft_electronics-cleaning',
    'opener_draft_anesthesia-machine', 'opener_draft_cardiac-monitor',
    'opener_draft_airway-devices', 'opener_draft_or-table',
    'opener_draft_temp-humidity', 'opener_draft_medical-gases',
    'opener_draft_laptop-ipad-wipedown'
  ];
  function formatStamp(d){
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' }) + ', ' +
           d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  }
  // Named function rather than an addEventListener closure -- the
  // failure path below replaces allDoneBox's whole innerHTML (including
  // the button the original listener was bound to), so retrying needs a
  // function that re-queries the DOM fresh each call, not a reference to
  // a specific node that might already be gone. Found this the hard way
  // via an actual failure-path test, not assumed safe.
  function attemptSubmit(){
    var btn = document.getElementById('finalSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    var session = null;
    try { session = JSON.parse(sessionStorage.getItem('opener_session') || 'null'); } catch(e) {}
    var room = sessionStorage.getItem('opener_active_room');
    if (!session || !room) {
      document.getElementById('allDoneBox').innerHTML =
        '<div class="icon">⚠️</div><h2>Session Not Found</h2>' +
        '<p style="font-size:12.5px;">Couldn\'t tell who\'s submitting this or which room it\'s for — please go back to the dashboard and start again.</p>' +
        '<a class="advance-link" href="index.html?view=dashboard">Back to Dashboard</a>';
      return;
    }

    var payload = {};
    OR_DRAFT_KEYS.forEach(function(key){
      var raw = localStorage.getItem(key);
      payload[key] = raw ? JSON.parse(raw) : null;
    });

    var now = new Date();
    var hour = now.getHours() + now.getMinutes() / 60;
    var late = !(hour >= 6 && hour < 23.5); // 6am-11:30pm on-time/late window; past that is a miss, but a submission happening at all beats silence

    supabaseInsert('submitted_logs', {
      date: now.toISOString().slice(0, 10),
      room: room,
      app_type: 'OR',
      recorder: session.name,
      late: late,
      payload: payload,
      submitted_at: now.toISOString()
    }).then(function(res){
      if (!res.ok) throw new Error('Supabase responded ' + res.status);
      OR_DRAFT_KEYS.forEach(function(key){ localStorage.removeItem(key); });
      sessionStorage.removeItem('opener_active_room');
      sessionStorage.removeItem('opener_active_app_type');
      document.getElementById('allDoneBox').innerHTML =
        '<div class="icon">📤</div>' +
        '<h2>Submitted</h2>' +
        '<p>This Opener Readiness Checklist has been recorded.</p>' +
        '<p class="popup-stamp">🕐 ' + formatStamp(now) + '</p>';
    }).catch(function(err){
      reportError('Submit failed: ' + err.message, err.stack, 'or-laptop-wipedown submit');
      document.getElementById('allDoneBox').innerHTML =
        '<div class="icon">⚠️</div><h2>Submit Failed</h2>' +
        '<p style="font-size:12.5px;">Nothing was lost — your answers are still saved on this device. Check your connection and try again.</p>' +
        '<button type="button" class="initiate-btn" id="finalSubmitBtn" onclick="attemptSubmit()">Try Again</button>';
    });
  }
  document.getElementById('finalSubmitBtn').addEventListener('click', attemptSubmit);

  render();
</script>
</body>
</html>
